<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1С:Предприятие — Вопросы и ответы</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263548;
    --border: #334155;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.12);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --answered-text: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-inner { max-width: 900px; margin: 0 auto; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .stats { display: flex; gap: 16px; font-size: 0.82rem; color: var(--text-muted); flex-shrink: 0; }
  .stats b { color: var(--text); }
  .search-wrap { margin-top: 12px; position: relative; }
  .search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px 10px 42px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .clear-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 1.1rem; padding: 4px; border-radius: 4px; display: none;
    transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--text); }
  .filter-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* Main */
  .main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .no-results svg { margin-bottom: 12px; opacity: 0.4; }

  /* Question card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #475569; }
  .card.answered { border-color: var(--border); opacity: 0.55; }
  .card-header {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
  }
  .card-num { font-size: 0.75rem; color: var(--text-muted); min-width: 28px; padding-top: 2px; flex-shrink: 0; }
  .card-question { font-size: 0.92rem; line-height: 1.5; flex: 1; }
  .card.answered .card-question { color: var(--answered-text); text-decoration: line-through; }
  .card-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; margin-left: auto;
  }
  .card-check:hover { border-color: var(--green); }
  .card.answered .card-check { background: var(--green); border-color: var(--green); }
  .card-check svg { display: none; }
  .card.answered .card-check svg { display: block; }

  /* Answer */
  .card-answer {}
  .card-answer-inner {
    border-top: 1px solid var(--border);
    padding: 12px 16px 14px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .answer-badge {
    background: var(--green-dim); color: var(--green);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 5px; padding: 2px 8px; font-size: 0.72rem; font-weight: 600;
    white-space: nowrap; flex-shrink: 0; margin-top: 2px;
  }
  .answer-text { font-size: 0.9rem; line-height: 1.5; color: var(--text); }

  /* Reset button */
  .reset-wrap { text-align: center; padding: 20px 0; }
  .reset-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 8px 20px; cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: #ef4444; color: #ef4444; }

  @media (max-width: 600px) {
    .header { padding: 12px 14px; }
    .main { padding: 12px 10px; }
    .card-header { padding: 12px 12px; }
    .card-answer-inner { padding: 10px 12px 12px; flex-direction: column; gap: 6px; }
    .stats { font-size: 0.78rem; gap: 10px; }
  }

  /* Highlight */
  mark { background: rgba(59,130,246,0.25); color: inherit; border-radius: 2px; padding: 0 1px; }
</style>

      <button class="clear-btn" id="clear-btn" title="Очистить">✕</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="unanswered">Не отвеченные</button>

const STORAGE_KEY = '1c_answered';
let answered = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let currentFilter = 'all';
let searchQuery = '';

const listEl = document.getElementById('list');
const noResults = document.getElementById('no-results');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
const statShown = document.getElementById('stat-shown');
const statDone = document.getElementById('stat-done');
const statTotal = document.getElementById('stat-total');

statTotal.textContent = QA.length;

function saveAnswered() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...answered]));
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query) {
  if (!query) return esc(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function render() {
  const q = searchQuery.toLowerCase().trim();
  let shown = 0;
  let html = '';

  QA.forEach(([question, answer], i) => {
    const isDone = answered.has(i);

    if (currentFilter === 'answered' && !isDone) return;
    if (currentFilter === 'unanswered' && isDone) return;

    // When searching: skip answered questions
    if (q && isDone) return;

    if (q && !question.toLowerCase().includes(q) && !answer.toLowerCase().includes(q)) return;

    shown++;

    html += `<div class="card${isDone ? ' answered' : ''}" data-i="${i}">
      <div class="card-header">
        <span class="card-num">${i + 1}.</span>
        <span class="card-question">${highlight(question, q)}</span>
        <span class="card-check" data-check="${i}" title="${isDone ? 'Снять отметку' : 'Отметить как отвеченный'}">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>
        </span>
      </div>
      <div class="card-answer" data-ans="${i}">
        <div class="card-answer-inner">
          <span class="answer-badge">Ответ</span>
          <span class="answer-text">${highlight(answer, q)}</span>
        </div>
      </div>
    </div>`;
  });

  listEl.innerHTML = html;
  noResults.style.display = shown === 0 ? '' : 'none';
  statShown.textContent = shown;
  statDone.textContent = answered.size;
}

// Toggle answer visibility
listEl.addEventListener('click', e => {
  // Check button
  const checkEl = e.target.closest('[data-check]');
  if (checkEl) {
    e.stopPropagation();
    const i = +checkEl.dataset.check;
    if (answered.has(i)) answered.delete(i);
    else answered.add(i);
    saveAnswered();
    render();
    return;
  }

});

// Search
searchEl.addEventListener('input', () => {
  searchQuery = searchEl.value;
  clearBtn.style.display = searchQuery ? '' : 'none';
  render();
});

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  searchQuery = '';
  clearBtn.style.display = 'none';
  searchEl.focus();
  render();
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    openCard = null;
    render();
  });
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!answered.size) return;
  if (confirm('Сбросить все отметки об отвеченных вопросах?')) {
    answered.clear();
    saveAnswered();
    render();
  }
});

render();
</script>
